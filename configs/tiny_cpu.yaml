# Tiny CPU config for development with random tensors (see CLAUDE.md "Build order").
device: cpu
seed: 0

# Environment stand-ins for random-tensor tests.
obs_dim: 5
act_dim: 2

model:
  mlp_units: 64       # d: MLP width
  recurrent_dim: 512  # 8d, size of h_t
  gru_blocks: 8       # block-diagonal GRU blocks
  K: 4                # number of categorical latents
  C: 8                # classes per latent
  unimix: 0.01
  mlp_layers: 3       # encoder, decoder, actor, critic
  prior_layers: 2     # official imglayers
  post_layers: 1      # official obslayers
  head_layers: 1      # reward and continue heads (official rewhead/conhead layers)
  cnn_depth: 4
  kernel: 5
  cnn_mults: [2, 3, 4, 4]
  bins: 255

train:
  batch_size: 2       # B
  seq_len: 8          # T
  horizon: 5          # H

actor:
  min_std: 0.1
  max_std: 1.0
  outscale: 0.01      # output layers start at 1% of normal scale
  entropy_coef: 3.0e-4

critic:
  slow_rate: 0.02     # slow critic EMA rate (decay 0.98), every step
  slow_reg: 1.0       # weight of the regularizer toward the slow critic
  gamma: 0.997        # 1 - 1/333
  lam: 0.95

loss_scales: {rec: 1.0, rew: 1.0, con: 1.0, dyn: 1.0, rep: 0.1, policy: 1.0, value: 1.0, repval: 0.3}
free_nats: 1.0

optim:                  # LaProp + AGC (official DreamerV3 settings)
  lr: 4.0e-5
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-20
  agc: 0.3
  pmin: 1.0e-3
  warmup: 1000          # linear LR ramp from 0 over the first 1000 updates

logging:
  wandb: false
  project: adam-dreamer-torch
  run_name: null        # null -> '<env>_seed<seed>' (set in train.py main)

checkpoint:
  dir: checkpoints      # latest.pt is overwritten every `every` env steps
  every: 1024        # a multiple of num_envs, so the step counter lands on it
