[project]
name = "adam-dreamer-torch"
version = "0.1.0"
description = "From-scratch PyTorch reproduction of DreamerV3 on DeepMind Control"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "gymnasium>=1.0",
    "dm-control>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:dm_control.*"]
